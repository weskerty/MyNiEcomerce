<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta property="og:url" content="https://cheagana.com/A/AgregarProducto">

<base href="/">
<script src="/web/js/HTMLCoreInyector.js" data-r="web/paginas/AgregarProducto.html"></script>
</head><body><div class="markdown-content"><style>
#ag .EasyMDEContainer :is(.CodeMirror,.editor-preview){background:var(--RD_C);color:var(--RD_F);border-color:var(--RD_L)}
#ag .EasyMDEContainer .CodeMirror{min-height:180px;border-radius:0 0 10px 10px}
#ag .editor-toolbar{border-color:var(--RD_L);border-radius:10px 10px 0 0}
#ag .editor-toolbar button{color:var(--RD_MF)}
#ag .editor-toolbar button:is(:hover,.active){background:var(--RD_BH);border-color:var(--RD_BHB)}
#ag .editor-toolbar i.separator{border-color:var(--RD_L)}
#ag .CodeMirror-cursor{border-left-color:var(--RD_F)}
#ag :is(.CodeMirror-selected,.CodeMirror-focused .CodeMirror-selected){background:var(--RD_BS)}
</style>
<h1 class="NB_TT">🏪 Publicar</h1>
<div id="ag" class="AG1" hidden>
<div data-v="nuevo">
<div class="GL_P1"><div class="AG_K" id="ap-tp"></div><p class="AG_H" id="ap-th"></p><label class="AG_F" id="ap-bl" hidden><span>Seccion del blog</span><select id="ap-bsec"></select></label>
<div class="AG_IR"><label class="AG_IM" id="ap-im"></label><div>
<label class="AG_F"><span id="ap-nbl">Nombre del producto</span><input id="ap-nb" maxlength="100" autocomplete="off"></label>
<label class="AG_F"><span>Codigo ID (opcional)</span><input id="ap-id" maxlength="50" autocomplete="off" placeholder="Vacio = aleatorio"><small class="AG_H" id="ap-ih"></small></label>
</div></div>
<div class="AG_R2 ap-p">
<label class="AG_F"><span>Precio (Gs)</span><input id="ap-pc" inputmode="numeric" maxlength="14" placeholder="50.000" autocomplete="off"></label>
<label class="AG_F"><span>Compra minima</span><input id="ap-cm" inputmode="numeric" maxlength="4" placeholder="1" autocomplete="off"></label>
<label class="AG_F"><span>Categoria</span><select id="ap-cat"></select></label>
<label class="AG_F"><span>Subcategoria</span><select id="ap-sub"></select></label>
<label class="AG_F AG_W"><span>Contacto</span><select id="ap-ch"><option value="WA.TG">WhatsApp y Telegram</option><option value="WA">Solo WhatsApp</option><option value="TG">Solo Telegram</option><option value="SM">Solo SMS</option><option value="WA.SM">WhatsApp y SMS</option><option value="WA.TG.SM">WhatsApp, Telegram y SMS</option></select></label>
<label class="AG_F AG_W"><span>Vence (opcional)</span><input id="ap-tm" type="datetime-local"></label>
</div>
<div class="AG_F ap-p"><span>Ubicacion (opcional)</span><button type="button" id="ap-gps">📍 Usar mi ubicacion</button><small class="AG_H" id="ap-gh"></small></div>
<div class="AG_F"><span id="ap-mh">Descripcion · <a href="web/paginas/Como%20Escribir%20tu%20Publicacion.html" target="_blank" rel="noopener">Como escribir tu publicacion ↗️</a></span><textarea id="ap-md"></textarea></div>
</div>
<button type="button" class="view-all-button AG_GO" id="ap-go">Enviar Solicitud</button>
</div>
</div>
<script src="/web/js/lib/Agregar.js"></script>
<script>
(()=>{
const AP_AN=(window.__AN1||'').toLowerCase(),AP_TA={producto:'',propuesta:'Propuestas',corrupcion:'Ejemplos de Corrupcion',blog:'Blogs'},KS=Object.values(AP_TA);
const AP_LIBS=[
  {k:'css',l:'web/js/lib/EasyMDE/easymde.min.css',c:'https://cdn.jsdelivr.net/npm/easymde@2/dist/easymde.min.css'},
  {k:'js',l:'web/js/lib/EasyMDE/easymde.min.js',c:'https://cdn.jsdelivr.net/npm/easymde@2/dist/easymde.min.js',ok:()=>window.EasyMDE},
  {k:'js',l:'web/js/lib/DOMPurify/purify.min.js',c:'https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js',ok:()=>window.DOMPurify}
];
const $=i=>document.getElementById(i),FP=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const T2L=t=>t?t.replace(/^(\d\d)\.(\d\d)\.(\d{4})\.(\d\d)\.(\d\d)$/,'$3-$2-$1T$4:$5'):'';
const L2T=v=>v?v.replace(/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d).*$/,'$3.$2.$1.$4.$5'):null;
const TPE=e=>e.categoria==='Blogs'?'Blogs':e.categoria==='DemoDire'?e.sub:'';
let tp=Object.hasOwn(AP_TA,AP_AN)?AP_TA[AP_AN]:'',ed=null,ct=null,mde=null,z,cats={},DP;
const D=()=>DP||(DP=Promise.all(['tienda','DemoDire','Blogs','🧩 Apps','🎮 Juegos'].map(b=>AG1.J(`/web/${b}/data.json`))).then(([t,dd,bl,ap,jg])=>{
  const all=[],ot=[];
  Object.entries(t).forEach(([c,v])=>AG1.EX(v,c,'',all));
  AG1.EX(dd.DemoDire||{},'DemoDire','',all);AG1.EX(bl.Blogs||{},'Blogs','',all);AG1.EX(ap,'','',ot);AG1.EX(jg,'','',ot);
  cats=Object.fromEntries(Object.entries(t).map(([c,v])=>[c,Array.isArray(v)?[]:Object.keys(v||{}).filter(k=>k!=='General')]));
  const s=$('ap-cat'),b=$('ap-bsec');
  if(s&&!s.options.length){Object.keys(cats).sort().forEach(c=>s.add(new Option(c,c)));SUB()}
  if(b&&!b.options.length)Object.keys(bl.Blogs||{}).forEach(k=>b.add(new Option(k,k)));
  return{all,ids:new Set([...all,...ot].map(e=>e.ID))};
}));
function SUB(){const s=$('ap-sub');s.replaceChildren(new Option('General',''));(cats[$('ap-cat').value]||[]).forEach(x=>s.add(new Option(x,x)))}
function TP(t,i){
  tp=t;const p=!t;
  document.querySelectorAll('#ag .ap-p').forEach(e=>e.hidden=!p);
  $('ap-bl').hidden=t!=='Blogs';
  $('ap-th').textContent=p?'Tu numero queda como contacto del producto':'Se publica sin tu numero de telefono, con un alias anonimo';
  $('ap-nbl').textContent=p?'Nombre del producto':'Titulo';
  $('ap-im').style.cssText=t==='Blogs'?'--ar:16/9;--w:128px':'';
  if(!i)z.re();
}
function RS(){
  ['ap-id','ap-nb','ap-pc','ap-cm','ap-tm'].forEach(i=>$(i).value='');
  $('ap-ih').textContent=$('ap-gh').textContent='';ct=ed=null;z.clr();
  if(mde)mde.value('');else $('ap-md').value='';
  $('ap-go').textContent='Enviar Solicitud';
}
async function FILL(o,md){
  RS();await D();
  const t=TPE(o);AG1.K($('ap-tp'),KS,t,TP);TP(t,1);
  if(t==='Blogs')$('ap-bsec').value=o.sub;
  if(!t){$('ap-cat').value=o.categoria;SUB();const s=$('ap-sub');s.value=o.sub||'';if(s.selectedIndex<0)s.selectedIndex=0}
  $('ap-ch').value=o.CH||'WA.TG';$('ap-id').value=o.ID;$('ap-nb').value=o.NB||'';
  $('ap-pc').value=+o.PC?FP(+o.PC):'';$('ap-cm').value=+o.CM>1?o.CM:'';$('ap-tm').value=T2L(o.TM);
  ct=o.CT||null;$('ap-gh').className='AG_H';$('ap-gh').textContent=ct?'Se mantiene la ubicacion anterior, podes actualizarla':'';
  if(md!=null){if(mde)mde.value(md);else $('ap-md').value=md}
  ed=o.ID;$('ap-go').textContent='Guardar Edicion';
  AG1.T(md!=null?'Volve a subir la imagen para reenviar':'Volve a completar la descripcion y la imagen','warn');
}
function GPS(){
  const b=$('ap-gps'),h=$('ap-gh');
  if(!navigator.geolocation)return AG1.T('Tu navegador no soporta ubicacion','err');
  b.disabled=true;h.className='AG_H';h.textContent='Obteniendo...';
  navigator.geolocation.getCurrentPosition(p=>{
    const{latitude:a,longitude:o}=p.coords;ct=`${a<0?'S':'N'}${Math.abs(a).toFixed(4)}${o<0?'W':'E'}${Math.abs(o).toFixed(4)}`;
    b.disabled=false;h.className='AG_H ok';h.textContent='Ubicacion guardada';
  },()=>{b.disabled=false;h.className='AG_H err';h.textContent='No se pudo obtener ubicacion'},{timeout:10000});
}
async function GO(){
  let id=$('ap-id').value;const nb=$('ap-nb').value.trim(),pc=$('ap-pc').value.replace(/\D/g,'');
  if(!nb)return AG1.F($('ap-nb'));
  if(!tp&&!+pc)return AG1.F($('ap-pc'));
  if(!z.v)return AG1.F(z.L);
  const{ids}=await D();
  if(!id){do id=Math.random().toString(36).slice(2,10).toUpperCase();while(ids.has(id));$('ap-id').value=id}
  else if(ids.has(id)&&id!==ed){AG1.T('Ese ID ya esta en uso, elegi otro','err');return AG1.F($('ap-id'))}
  const bl=tp==='Blogs',b=tp?{categoria:bl?'Blogs':'DemoDire',subcategoria:bl?$('ap-bsec').value:tp,PC:'0'}:{categoria:$('ap-cat').value,subcategoria:$('ap-sub').value,PC:pc,CM:$('ap-cm').value||null,TM:L2T($('ap-tm').value),CH:$('ap-ch').value,CT:ct};
  Object.assign(b,{ID:id,NB:nb,md:mde?mde.value():$('ap-md').value,imgData:await AG1.B64(z.v.b),imgExt:z.v.x});
  AG1.SEND($('ap-go'),b,RS);
}
const C={
  own:c=>!/^(evento|minecraft|jugadores)$/.test(c),
  pub:async()=>{
    const{all}=await D(),u=AG1.U();
    return all.filter(e=>e.NM&&(e.NM===u.tel||e.NM===u.al)).map(e=>{
      const t=TPE(e);
      return{ID:e.ID,nb:e.NB,tp:t,img:e.fn,href:e.fn.replace(/\.[^.]+$/,'.html'),
        meta:(t?(AG1.TY[t]?.[1]||t)+(t==='Blogs'?' · '+e.sub:''):`${e.categoria}${e.sub?' / '+e.sub:''} · ${FP(e.PC)} Gs${e.CD==='0'?' · Agotado':''}`)+' · ID '+e.ID,
        acts:[['✏️ Editar',()=>{AG1.V('nuevo');FILL(e)}],['🗑️ Pedir borrado',()=>AG1.DEL(e.ID,e.NB)]]};
    });
  },
  fix:d=>FILL(d,String(d.md||'').replace(/&lt;/g,'<')),
  vw:v=>{
    if(v!=='nuevo')return;
    D();
    Promise.all(AP_LIBS.map(AG1.LL)).then(()=>{
      if(!window.EasyMDE||!$('ap-md'))return;
      if(mde)return mde.codemirror.refresh();
      mde=new EasyMDE({element:$('ap-md'),spellChecker:false,autofocus:false,status:false,initialValue:'',
        renderingConfig:{sanitizerFunction:h=>window.DOMPurify?DOMPurify.sanitize(h):''},
        toolbar:['bold','italic','heading','|','quote','unordered-list','ordered-list','|','link','|','preview','guide']});
    });
  },
  ini:()=>{
    AG1.K($('ap-tp'),KS,tp,TP);
    z=AG1.IZ($('ap-im'),()=>tp==='Blogs'?{crop:1,ar:16/9,fit:1}:{crop:1,ar:NaN});
    TP(tp,1);
    $('ap-cat').onchange=SUB;$('ap-gps').onclick=GPS;$('ap-go').onclick=GO;
    $('ap-pc').oninput=e=>{const v=e.target.value.replace(/\D/g,'').slice(0,10);e.target.value=v?FP(+v):''};
    $('ap-cm').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,4);
    $('ap-nb').oninput=e=>e.target.value=e.target.value.replace(/[/\\<>"'`\x00-\x1f]/g,'').slice(0,100);
    $('ap-id').oninput=async e=>{
      const v=e.target.value=e.target.value.normalize('NFD').replace(/\s/g,'_').replace(/[^a-zA-Z0-9_]/g,'').slice(0,50),h=$('ap-ih'),{ids}=await D(),u=ids.has(v)&&v!==ed;
      h.className='AG_H'+(v?u?' err':' ok':'');
      h.textContent=!v?'':v===ed?'Editando esta publicacion':u?'Ese ID ya esta en uso, elegi otro':'ID disponible';
    };
  }
};
window.AG1?AG1(C):window.AG_Q=C;
})();
</script>
</div></body></html>
