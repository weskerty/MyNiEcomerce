<style>
#sh-w *{box-sizing:border-box}
.RD_SB1{max-width:760px;margin:32px auto 0}
#sh-bar{display:flex;align-items:center;gap:12px;height:60px;padding:0 10px 0 18px;border:1px solid var(--RD_L);border-radius:16px;background:var(--RD_C);box-shadow:var(--RD_SH);transition:border-color .15s,box-shadow .15s}
#sh-bar:focus-within{border-color:rgba(255,255,255,.35);box-shadow:var(--RD_SH),0 0 0 4px rgba(255,255,255,.06)}
#sh-icon{display:flex;color:var(--RD_MF)}
#sh-inp{flex:1;min-width:0;height:100%;padding:0;border:0;background:none;box-shadow:none;color:var(--RD_F);font-size:1.1rem}
#sh-inp:focus{box-shadow:none}
#sh-inp::placeholder{color:var(--RD_MF)}
#sh-inp::-webkit-search-cancel-button,#sh-inp::-webkit-search-decoration{-webkit-appearance:none;display:none}
#sh-clr{display:none;width:30px;height:30px;padding:0;border:0;border-radius:8px;background:var(--RD_M);color:var(--RD_MF);cursor:pointer;flex-shrink:0;align-items:center;justify-content:center}
#sh-clr.sh-vis{display:flex}
#sh-clr:hover{color:var(--RD_F)}
#sh-bar .GV1{width:36px;padding:0;justify-content:center;border-color:#0000;background:none}
#sh-r{display:flex;flex-direction:column;gap:24px;margin-top:28px;scroll-margin-top:90px}
.sh-skeleton{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.sh-sk-item{aspect-ratio:3/4;border-radius:16px;background:linear-gradient(90deg,var(--RD_M),var(--RD_L),var(--RD_M));background-size:200% 100%;animation:sh-shimmer 1.4s infinite}
@keyframes sh-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sh-hd{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin:0 0 18px}
.sh-hd h2{margin:0;font-size:1.4rem}
.sh-cnt{margin:0;font-size:.9rem;color:var(--RD_MF)}
.sh-cnt b{color:var(--RD_F)}
.sh-sc{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.sh-sc .PL1 span{margin-left:2px;font-size:.75rem;color:var(--RD_MF)}
.sh-sub+.sh-sub{margin-top:20px}
.sh-sub>h3{margin:0 0 10px;font-size:.72rem;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--RD_MF)}
.sh-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(150px,calc(50% - 6px)),1fr));gap:12px;align-items:start}
body:not(.LS1) .sh-it{flex-direction:column;align-items:stretch;min-height:0;border-radius:16px}
body:not(.LS1) .sh-it::before{display:none}
body:not(.LS1) .sh-it>img{width:100%;height:auto;aspect-ratio:1}
body:not(.LS1) .sh-it-info{justify-content:flex-start;padding:10px 12px 12px;gap:4px}
body.LS1 .sh-g{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px}
.sh-it-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sh-it-pc{font-size:.85rem;font-weight:700;white-space:nowrap}
.sh-it-cat{font-size:.72rem;color:var(--RD_MF);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-it mark{padding:0 1px;border-radius:3px;background:rgba(250,204,21,.28);color:inherit}
.sh-out{opacity:.55}
.sh-out img{filter:grayscale(1)}
.sh-out-tag{padding:0 8px;border:1px solid var(--RD_L);border-radius:8px;font-size:.66rem;font-weight:600;color:var(--warn)}
.sh-mt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 16px;text-align:center;color:var(--RD_MF)}
.sh-mt span{font-size:2.4rem;line-height:1}
.sh-mt b{color:var(--RD_F);font-size:1.05rem}
.sh-mt button{margin-top:8px}
</style>

<div id="sh-w">
<div class="RD_SB1">
<div id="sh-bar">
<span id="sh-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
<input id="sh-inp" type="search" placeholder="Buscar productos, blogs, apps..." autocomplete="off" enterkeyhint="search">
<button id="sh-clr" aria-label="Limpiar">✕</button>
<button class="PL1 GV1" aria-label="Lista o cuadricula"></button>
</div>
</div>
<div id="sh-r"></div>
</div>

<script>
(function(){
const DJ='web/tienda/data.json';
const EXTRA_DJ=[
['web/Blogs/data.json','b'],
['web/🎮 Juegos/data.json','j'],
['web/🧩 Apps/data.json','a']
];
const SC1=[['','Todo'],['t','Productos'],['b','Blog'],['a','Apps'],['j','Juegos']],SC2={b:'Blog',a:'App',j:'Juego'};
const MS_CDN='https://cdn.jsdelivr.net/npm/minisearch@7/dist/umd/index.js';
const MS_LOCAL='web/js/lib/MiniSearch/index.js';
const PAGE=40;

let ms,allItems=[],ready=false,curList=[],curPg=0,dbt=null,_idc=0,curFlat=false,curRes=[],curSc='',curTerms=[];

const inp=document.getElementById('sh-inp');
const clr=document.getElementById('sh-clr');
const r=document.getElementById('sh-r');

function fN(p){return p.split('/').pop().replace(/\.[^.]+$/,'')}
function nN(n){const m=n.match(/NB=(.+)/);return m?m[1].trim():n}
function mL(p){return p.replace(/\.[^.]+$/,'.html')}
const _PC=/PC=(\d+)/,_ID=/ID=(.*?)(?=-[A-Z]{2}=|$)/;
function fPC(n){const m=n.match(_PC);return m?m[1].replace(/\B(?=(\d{3})+(?!\d))/g,'.')+' Gs':''}
function fID(n){const m=n.match(_ID);return m?m[1]:''}

function gHA(){
  const h=window.location.hash;
  if(!h)return'';
  const pts=h.substring(1).split('#');
  return pts.length>1?decodeURIComponent(pts[1]):'';
}

let gfP=null;
const GF1=()=>window.GridFit?Promise.resolve(window.GridFit):gfP||(gfP=new Promise(r=>{const s=document.createElement('script');s.src='web/js/lib/GridFit.js';s.onload=s.onerror=()=>r(window.GridFit);document.head.appendChild(s)}));
function loadMS(){
  return window.MiniSearch?Promise.resolve():new Promise(res=>{
    const s=document.createElement('script');
    s.src=MS_LOCAL;s.onload=res;
    s.onerror=()=>{const f=document.createElement('script');f.src=MS_CDN;f.onload=f.onerror=res;document.head.appendChild(f)};
    document.head.appendChild(s);
  });
}

function addIt(p,cat,sub,ex,src){const f=fN(p);allItems.push({id:_idc++,name:nN(f),pid:fID(f),cat,sub,img:p,ex,src:src||'t',hasNB:/NB=/.test(f),soldOut:/CD=0(?!\d)/.test(f)})}
function mV(){return allItems.filter(it=>!it.ex&&it.hasNB&&!it.soldOut)}
function buildItems(galleries,ex,src){
  Object.entries(galleries).forEach(([cat,val])=>{
    if(Array.isArray(val))val.forEach(p=>addIt(p,cat,'',ex,src));
    else Object.entries(val).forEach(([sub,arr])=>arr.forEach(p=>addIt(p,cat,sub,ex,src)));
  });
}
function addEx(){EXTRA_DJ.forEach(([j,s])=>{const g=window.__DJ?.[j];if(g)buildItems(g,1,s)})}

function buildItemsFromIdx(idx){
  for(const cat in idx){
    const sec=idx[cat];
    if(Object.keys(sec.f).length){
      for(const sub in sec.f)sec.f[sub].forEach(p=>addIt(p,cat,sub,0));
    }else sec._all.forEach(p=>addIt(p,cat,'',0));
  }
}

function mkItem(it){
  const a=document.createElement('a');
  a.className='sh-it'+(it.soldOut?' sh-out':'');a.href=mL(it.img);
  const img=document.createElement('img');
  img.src=it.img;img.alt=it.name;img.loading='lazy';img.decoding='async';img.width=58;img.height=58;
  const info=document.createElement('div');info.className='sh-it-info';
  const nm=document.createElement('span');nm.className='sh-it-name';HL1(nm,it.name);
  info.appendChild(nm);
  const pc=fPC(fN(it.img));
  if(pc||it.soldOut){
    const mt=document.createElement('div');mt.className='sh-it-meta';
    if(pc){const e=document.createElement('span');e.className='sh-it-pc';e.textContent=pc;mt.appendChild(e)}
    if(it.soldOut){const t=document.createElement('span');t.className='sh-out-tag';t.textContent='Agotado';mt.appendChild(t)}
    info.appendChild(mt);
  }
  if(curFlat&&it.cat){
    const c=document.createElement('span');c.className='sh-it-cat';
    c.textContent=(SC2[it.src]?SC2[it.src]+' · ':'')+(it.sub&&it.src!=='t'?it.sub:it.sub?it.cat+' · '+it.sub:it.cat);
    info.appendChild(c);
  }
  a.appendChild(img);a.appendChild(info);
  return a;
}

function buildPage(list,p){
  const frag=document.createDocumentFragment();
  const s=p*PAGE,slice=list.slice(s,s+PAGE);
  if(curFlat){
    const box=document.createElement('section'),g=document.createElement('div');box.className='sh-flat GL_P1';
    g.className='sh-g';box.append(SH1(),g);
    slice.forEach(it=>g.appendChild(mkItem(it)));
    frag.appendChild(box);
    return frag;
  }
  const cats={};
  slice.forEach(it=>{
    if(!cats[it.cat])cats[it.cat]={};
    const sk=it.sub||'__';
    if(!cats[it.cat][sk])cats[it.cat][sk]=[];
    cats[it.cat][sk].push(it);
  });
  Object.entries(cats).forEach(([cat,subs])=>{
    const catDiv=document.createElement('section');catDiv.className='sh-cat GL_P1';
    const hd=document.createElement('div');hd.className='sh-hd';
    const h2=document.createElement('h2');h2.textContent=cat;
    hd.appendChild(h2);catDiv.appendChild(hd);
    Object.entries(subs).forEach(([sub,its])=>{
      const subDiv=document.createElement('div');subDiv.className='sh-sub';
      if(sub!=='__'){const h3=document.createElement('h3');h3.textContent=sub;subDiv.appendChild(h3);}
      const g=document.createElement('div');g.className='sh-g';
      its.forEach(it=>g.appendChild(mkItem(it)));
      subDiv.appendChild(g);catDiv.appendChild(subDiv);
    });
    frag.appendChild(catDiv);
  });
  return frag;
}

function scrollToTop(){
  const w=document.getElementById('sh-r');
  if(w&&w.scrollIntoView)w.scrollIntoView({behavior:'smooth',block:'start'});
}

function renderPage(list,p,animate,dir){
  r.innerHTML='';
  if(!list.length){
    const m=document.createElement('div'),e=document.createElement('span'),t=document.createElement('b'),p=document.createElement('p'),v=document.createElement('button');
    m.className='sh-mt';e.textContent='🔍';t.textContent='Sin resultados para «'+inp.value.trim()+'»';p.textContent='Proba con otra palabra, un codigo de producto o una categoria.';v.textContent='Ver todo el catalogo';v.onclick=()=>clr.click();
    m.append(e,t,p,v);r.appendChild(m);return;
  }
  const maxPg=Math.ceil(list.length/PAGE)-1;
  r.appendChild(buildPage(list,p));
  if(list.length>PAGE){
    const nav=document.createElement('nav');
    if(window.GridFit)GridFit.PN1(nav,p,maxPg+1,i=>{const d=i>curPg?1:-1;curPg=i;renderPage(curList,curPg,true,d);scrollToTop()});
    r.appendChild(nav);
  }
  if(animate){r.style.setProperty('--d',dir?(dir>0?'24px':'-24px'):'0px');r.classList.remove('AN1');void r.offsetWidth;r.classList.add('AN1')}
}

function showSkeleton(){
  const sk=document.createElement('div');sk.className='sh-skeleton';
  for(let i=0;i<8;i++){const d=document.createElement('div');d.className='sh-sk-item';d.style.animationDelay=(i*.08)+'s';sk.appendChild(d);}
  r.innerHTML='';r.appendChild(sk);
}

function paintThen(cb){
  requestAnimationFrame(()=>requestAnimationFrame(cb));
}

const HL_W=/[\p{L}\p{N}]/u;
function HL1(el,t){
  const lo=t.toLowerCase(),R=[];
  curTerms.forEach(w=>{for(let i=lo.indexOf(w);w&&i>-1;i=lo.indexOf(w,i+w.length))if(!HL_W.test(lo[i-1]||'')&&!HL_W.test(lo[i+w.length]||''))R.push([i,i+w.length])});
  R.sort((a,b)=>a[0]-b[0]);
  let p=0;
  for(const[a,b]of R){if(a<p)continue;el.append(t.slice(p,a));const m=document.createElement('mark');m.textContent=t.slice(a,b);el.append(m);p=b}
  el.append(t.slice(p));
}
function SH1(){
  const h=document.createElement('div'),c=document.createElement('p'),q=document.createElement('b'),n=document.createElement('div');
  h.className='sh-hd';c.className='sh-cnt';n.className='sh-sc';
  q.textContent='«'+inp.value.trim()+'»';
  c.append(curList.length+(curList.length===1?' resultado para ':' resultados para '),q);
  SC1.forEach(([k,l])=>{
    const t=k?curRes.filter(x=>x.src===k).length:curRes.length;
    if(k&&!t)return;
    const b=document.createElement('button'),s=document.createElement('span');
    b.className='PL1'+(curSc===k?' PL1_A':'');b.textContent=l;s.textContent=t;b.appendChild(s);
    b.onclick=()=>{curSc=k;SR1();renderPage(curList,0,false)};
    n.appendChild(b);
  });
  h.append(c,n);
  return h;
}
function SR1(){curList=curSc?curRes.filter(x=>x.src===curSc):curRes;curPg=0}
function SQ1(q){
  const res=ms.search(q);
  curTerms=[...new Set(res.flatMap(x=>x.terms))];
  curRes=res.map(x=>allItems[x.id]);
  if(curSc&&!curRes.some(x=>x.src===curSc))curSc='';
  SR1();
}
function doSearch(){
  const q=inp.value.trim();
  clr.classList.toggle('sh-vis',q.length>0);
  curFlat=!!q;
  if(!q){curTerms=[];curList=mV();curPg=0;renderPage(curList,0,false);return;}
  SQ1(q);renderPage(curList,0,false);
}

function initMS(){
  ms=new MiniSearch({fields:['name','cat','sub','pid'],searchOptions:{prefix:true,fuzzy:.3,combineWith:'OR'}});
  ms.addAll(allItems);
  ready=true;
  const q0=inp.value.trim()||gHA();
  if(q0&&!document.getElementById(q0)){
    inp.value=q0;
    clr.classList.add('sh-vis');
    curFlat=true;
    SQ1(q0);renderPage(curList,0,true);
  }else{
    curFlat=false;
    curList=mV();curPg=0;
    renderPage(curList,0,false);
  }
}

function fetchExtra(j){
  let g=window.__DJ?.[j]||null;
  if(g)return Promise.resolve(g);
  return fetch(j).then(r=>r.json()).then(d=>{
    (window.__DJ=window.__DJ||{})[j]=d.galleries;
    return d.galleries;
  }).catch(()=>null);
}

async function heavyWork(){
  const gidx=window.__GIDX?.[DJ];
  if(gidx)buildItemsFromIdx(gidx);
  else{
    let g=window.__DJ?.[DJ];
    if(!g){g=(await(await fetch(DJ)).json()).galleries;(window.__DJ=window.__DJ||{})[DJ]=g}
    buildItems(g);
  }
  await Promise.all(EXTRA_DJ.map(([j])=>fetchExtra(j)));
  addEx();
}

async function init(){
  showSkeleton();
  await new Promise(paintThen);
  try{
    await Promise.all([heavyWork(),GF1(),loadMS()]);
    initMS();
  }catch(e){
    r.innerHTML='<div class="sh-mt"><span>⚠️</span>Error cargando datos</div>';
    return;
  }
  if(!window.__GIDX?.[DJ])window.__reqGeo?.(async()=>{
    await window.__GLD?.(DJ);
    const gidx=window.__GIDX?.[DJ];
    if(!gidx)return;
    allItems=[];_idc=0;buildItemsFromIdx(gidx);addEx();
    ms.removeAll();ms.addAll(allItems);
    doSearch();
  });
}

inp.addEventListener('input',()=>{
  if(!ready)return;
  clearTimeout(dbt);dbt=setTimeout(doSearch,250);
});

inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur()});

clr.addEventListener('click',()=>{
  inp.value='';clr.classList.remove('sh-vis');inp.focus();
  if(ready){curFlat=false;curTerms=[];curList=mV();curPg=0;renderPage(curList,0,false);}
});

window.__KP1?.();
init();
inp.focus();
try{navigator.virtualKeyboard?.show()}catch(e){}
})();
</script>
