<style>
#bl-wrap *{box-sizing:border-box}
.bl-nb{position:absolute;top:0;font-size:1.8rem;text-decoration:none;z-index:10}
.bl-nb-l{left:0}
.bl-nb-r{right:0}
.bl-head{margin-bottom:clamp(16px,3vw,32px)}

.bl-head h2{font-weight:400}
.bl-head p{font-size:.8rem;color:rgba(255,255,255,.5);margin-top:5px;font-weight:300;letter-spacing:.06em;text-transform:uppercase}
.bl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));grid-auto-flow:dense;grid-auto-rows:4px;gap:16px;align-items:start}
.bl-card{position:relative;border-radius:20px;overflow:hidden;cursor:pointer;text-decoration:none;display:block;min-height:200px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);box-shadow:0 4px 24px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.15);transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s ease}
.bl-card::after{content:'';position:absolute;inset:0;z-index:3;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.12),transparent 60%);transform:translateX(-120%);transition:.6s;pointer-events:none}
.bl-card:hover::after{transform:translateX(120%)}
.bl-card:hover{will-change:transform;transform:translateY(-5px) scale(1.01);box-shadow:0 16px 40px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.2);text-decoration:none}
.bl-card:active{transform:scale(.98)}
.bl-bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform .4s cubic-bezier(.2,.8,.2,1),filter .3s ease;filter:brightness(.5) saturate(1.2)}
.bl-card:hover .bl-bg{transform:scale(1.05);filter:brightness(.4) saturate(1.4)}
.bl-bg-none{background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}
.bl-gloss{position:absolute;top:0;left:0;right:0;height:50%;background:linear-gradient(180deg,rgba(255,255,255,.1) 0%,transparent 100%);pointer-events:none;border-radius:20px 20px 0 0}
.bl-body{position:relative;z-index:2;padding:20px 18px 18px;display:flex;flex-direction:column;justify-content:flex-end;min-height:200px}
.bl-cat{font-size:.68rem;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:7px;display:flex;align-items:center;gap:5px}
.bl-cat::before{content:'';display:inline-block;width:14px;height:1px;background:rgba(255,255,255,.35)}
.bl-title{font-family:var(--font-h);font-size:clamp(1rem,2.5vw,1.3rem);font-weight:400;color:rgba(255,255,255,.95);line-height:1.25;text-shadow:0 2px 10px rgba(0,0,0,.4)}
.bl-empty{text-align:center;padding:50px 20px;color:rgba(255,255,255,.4)}
.bl-empty span{display:block;font-size:2rem;margin-bottom:10px}
.bl-dots{display:flex;align-items:center;justify-content:center;gap:7px;padding:50px}
.bl-dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4);animation:blP .8s ease-in-out infinite}
.bl-dot:nth-child(2){animation-delay:.15s}
.bl-dot:nth-child(3){animation-delay:.3s}
@keyframes blP{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
.BN_BR{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap}
#nt-btn,.BN_RL{padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);font-size:.78rem;letter-spacing:.05em;cursor:pointer;transition:background .2s,transform .15s;line-height:1.2}
#nt-btn{display:none}
#nt-btn:hover,.BN_RL:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
.BN_CBX{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0 0 14px}
#nt-btn:disabled{opacity:.5;cursor:default;transform:none}
#BN_RB{display:contents}
.BN_RL{display:inline-flex;align-items:center;text-decoration:none;border-color:rgba(255,140,0,.35);background:rgba(255,140,0,.08);color:#ffaa33}
.BN_RL:hover{background:rgba(255,140,0,.18)}
.BN_BG{position:relative;aspect-ratio:16/9;background-size:cover;background-position:center;filter:saturate(1.15);transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.bl-card:hover .BN_BG{transform:scale(1.03)}
.BN_BGN{height:auto;aspect-ratio:auto;background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.02))}
.BN_GL{position:absolute;left:0;right:0;bottom:0;height:60%;background:linear-gradient(0deg,rgba(0,0,0,.65) 0%,transparent 100%);pointer-events:none}
.BN_BGN .BN_GL{display:none}
.BN_TT{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:12px 18px}
.BN_TT .bl-title{font-size:clamp(.95rem,2.3vw,1.15rem)}
.BN_BGN .BN_TT{position:static;padding:14px 18px 4px}
.BN_DS{padding:10px 18px 18px;font-size:.85rem;line-height:1.55;color:rgba(255,255,255,.75)}

<div class="BN_CBX" id="bl-cats"></div>
<div class="bl-dots" id="bl-ld"><div class="bl-dot"></div><div class="bl-dot"></div><div class="bl-dot"></div></div>
<div class="bl-grid" id="bl-gr" style="display:none"></div>
<div id="bl-nav"></div>

<script>
(function(){
const DJ='web/otros/Archivos/Dinamico/Blogs/data.json';
const TJ='web/otros/Archivos/Dinamico/Blogs/time.json';
let BN_T1=null;
async function BN_FT1(){
  if(BN_T1)return BN_T1;
  try{BN_T1=await(await fetch(TJ)).json();}catch(e){BN_T1={};}
  return BN_T1;
}
const RSS=window.__CFG?.rss||[];
const BN_NOTITLE=true;
const RU=p=>'/api/rss?url='+encodeURIComponent(p);
let PAGE=20;
let curList=[],curPg=0,imgIO=null,fetchAC=null,rssAC=null,_ini=false,_lst=[],_cat=null;

function fN(p){return p.split('/').pop().replace(/\.[^.]+$/,'')}
function mL(p){return p.replace(/\.[^.]+$/,'.md')}
function nN(n){const m=n.match(/NB=([^.]+)/);return m?m[1].trim():n.replace(/-/g,' ')}

function parseBlogs(galleries){
  const bl=galleries.Blogs;
  if(!bl)return[];
  const out=[],sub=typeof bl==='object'&&!Array.isArray(bl)?bl:{_r:Array.isArray(bl)?bl:[]};
  Object.keys(sub).forEach(k=>{
    const arr=sub[k];if(!Array.isArray(arr))return;
    arr.forEach(p=>{if(typeof p==='string')out.push({t:'b',img:p,md:mL(p),name:nN(fN(p)),cat:k==='_r'?'BLOG':k});});
  });
  const T=BN_T1||{};
  out.sort((a,b)=>(T[b.md]||'').localeCompare(T[a.md]||''));
  return out;
}

function BN_GT(el,tag){return el.getElementsByTagName(tag)[0]?.textContent||'';}
function BN_GH(el,tag){
  const n=el.getElementsByTagName(tag)[0];
  if(!n)return'';
  const c=n.firstChild;
  return(c&&c.nodeType===4)?c.data:n.textContent;
}

function BN_P1(txt){
  const doc=new DOMParser().parseFromString(txt,'text/xml');
  if(doc.querySelector('parsererror'))return[];
  return[...doc.querySelectorAll('item')].map(it=>{
    const desc=BN_GH(it,'description');
    const d=new DOMParser().parseFromString(desc,'text/html');
    const im=d.querySelector('img');
    const img=im?im.src:'web/otros/Archivos/Imagenes/Permanente/VacioFallback.jpg';
    d.querySelectorAll('img,video,audio').forEach(t=>t.remove());
    return{t:'n',link:BN_GT(it,'link'),name:BN_GT(it,'title'),img,desc:(d.body.textContent||'').trim()};
  }).filter(BN_OK1);
}

function BN_OK1(x){
  if(x.desc||x.img)return true;
  return !!x.name&&isNaN(Date.parse(x.name));
}

async function BN_FR(){
  if(!RSS.length)return[];
  if(rssAC)rssAC.abort();
  rssAC=new AbortController();
  const sig=rssAC.signal;
  const all=await Promise.all(RSS.map(p=>
    fetch(RU(p),{signal:sig})
      .then(r=>r.ok?r.text():'')
      .then(t=>t?BN_P1(t):[])
      .catch(()=>[])
  ));
  return all.flat();
}

async function BP_1(gr){
  if(document.body.classList.contains('low-perf'))return PAGE;
  if(!window.GridFit)await new Promise(r=>{const s=document.createElement('script');s.src='web/scripts/Otros/GridFit.js';s.onload=r;s.onerror=r;document.head.appendChild(s)});
  return window.GridFit?window.GridFit.itemsPerPage(gr,280,200,16,60):PAGE;
}

function BN_CF(){
  const gr=document.getElementById('bl-gr');
  if(!gr)return;
  curList=_cat?_lst.filter(x=>x.t==='b'&&x.cat===_cat):_lst;
  curPg=0;
  renderPage(gr,curList,0,true);
}

function BN_CB1(cats){
  const box=document.getElementById('bl-cats');
  if(!box)return;
  box.innerHTML='';
  if(cats.length<2)return;
  cats.forEach(name=>{
    const b=document.createElement('button');
    b.className='PL1';b.textContent=name;
    b.addEventListener('click',()=>{
      _cat=_cat===name?null:name;
      [...box.children].forEach(x=>x.classList.toggle('PL1_A',x===b&&_cat!==null));
      BN_CF();
    });
    box.appendChild(b);
  });
}

function BN_RB1(){
  const box=document.getElementById('BN_RB');
  if(!box)return;
  box.innerHTML='';
  RSS.forEach(p=>{
    const a=document.createElement('a');
    a.className='BN_RL';a.href=RU(p);a.target='_blank';a.rel='noopener noreferrer';
    a.textContent='📡 '+(RSS.length>1?p.split('/').pop():'RSS');
    box.appendChild(a);
  });
}

async function fetchData(){
  let g=window.__DJ?.[DJ]||null;
  if(!g){
    if(fetchAC)fetchAC.abort();
    fetchAC=new AbortController();
    try{
      const res=await fetch(DJ,{signal:fetchAC.signal});
      const d=await res.json();
      g=d.galleries;
      (window.__DJ=window.__DJ||{})[DJ]=g;
      fetchAC=null;
    }catch(e){
      if(e.name==='AbortError')return null;
      return null;
    }
  }
  return g;
}

function BN_MIX(bl,nw){
  const out=[];let i=0,j=0;
  while(i<bl.length||j<nw.length){
    if(i<bl.length)out.push(bl[i++]);
    if(j<nw.length)out.push(nw[j++]);
  }
  return out;
}

function BN_CT(box,cat,title){
  const c=document.createElement('div');c.className='bl-cat';c.textContent=cat;
  const t=document.createElement('div');t.className='bl-title';t.textContent=title;
  box.append(c,t);
}

function mkCard(item){
  const a=document.createElement('a');
  a.className='bl-card';
  if(item.t==='n'){
    a.href=/^https?:\/\//i.test(item.link)?item.link:'#';
    a.target='_blank';a.rel='noopener noreferrer';
    const bg=document.createElement('div');
    bg.className='BN_BG'+(item.img?'':' BN_BGN');
    if(item.img)bg.dataset.bg=item.img;
    if(!BN_NOTITLE){
      const gl=document.createElement('div');gl.className='BN_GL';
      const tt=document.createElement('div');tt.className='BN_TT';
      BN_CT(tt,'NOTICIA',item.name);
      bg.append(gl,tt);
    }
    const ds=document.createElement('div');ds.className='BN_DS';ds.textContent=item.desc;
    a.append(bg,ds);
  }else{
    a.href=item.md;
    const bg=document.createElement('div');
    bg.className='bl-bg'+(item.img?'':' bl-bg-none');
    if(item.img)bg.dataset.bg=item.img;
    const gl=document.createElement('div');gl.className='bl-gloss';
    const bd=document.createElement('div');bd.className='bl-body';
    BN_CT(bd,item.cat,item.name);
    a.append(bg,gl,bd);
  }
  return a;
}

function setupImgIO(){
  if(imgIO)imgIO.disconnect();
  imgIO=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(!e.isIntersecting)return;
      const bg=e.target,url=bg.dataset.bg;
      if(url){
        bg.style.backgroundImage='url('+encodeURI(url)+')';
        delete bg.dataset.bg;
        if(bg.classList.contains('BN_BG')){
          const im=new Image();
          im.onload=()=>{if(im.naturalWidth&&im.naturalHeight)bg.style.aspectRatio=im.naturalWidth+'/'+im.naturalHeight;GS1(bg.closest('.bl-card'))};
          im.onerror=()=>{bg.classList.add('BN_BGN');bg.style.backgroundImage='none';GS1(bg.closest('.bl-card'))};
          im.src=url;
        }else{
          GS1(bg.closest('.bl-card'));
        }
      }
      imgIO.unobserve(bg);
    });
  },{rootMargin:'100px'});
}

function BS1(g){if(g&&g.scrollIntoView)g.scrollIntoView({behavior:'smooth',block:'start'})}

function GS1(card){
  const st=getComputedStyle(card.parentElement);
  const rh=parseFloat(st.getPropertyValue('grid-auto-rows'))||4;
  const gap=parseFloat(st.getPropertyValue('gap'))||0;
  const h=card.getBoundingClientRect().height;
  const span=Math.ceil((h+gap)/(rh+gap));
  card.style.gridRowEnd='span '+span;
}

function GS_ALL(gr){
  gr.querySelectorAll('.bl-card').forEach(GS1);
}

function renderPage(gr,list,p,animate,dir){
  gr.innerHTML='';
  const navBox=document.getElementById('bl-nav');
  if(navBox)navBox.innerHTML='';
  if(!list.length){
    gr.innerHTML='<div class="bl-empty"><span>📭</span>Sin articulos por ahora</div>';
    return;
  }
  const maxPg=Math.ceil(list.length/PAGE)-1;
  const s=p*PAGE,slice=list.slice(s,s+PAGE);
  setupImgIO();
  slice.forEach(item=>{
    const card=mkCard(item);
    gr.appendChild(card);
    const bg=card.querySelector('[data-bg]');
    if(bg)imgIO.observe(bg);
  });
  if(list.length>PAGE){
    const nav=document.createElement('div');nav.className='PG1';
    const bP=document.createElement('button');bP.textContent='Anterior';bP.disabled=p===0;
    const bN=document.createElement('button');bN.textContent='Siguiente';bN.disabled=p===maxPg;
    bP.onclick=()=>{curPg--;renderPage(gr,curList,curPg,true,-1);BS1(gr)};
    bN.onclick=()=>{curPg++;renderPage(gr,curList,curPg,true,1);BS1(gr)};
    nav.appendChild(bP);nav.appendChild(bN);(navBox||gr).appendChild(nav);
  }
  if(animate){gr.style.setProperty('--d',dir?(dir>0?'24px':'-24px'):'0px');gr.classList.remove('AN1');void gr.offsetWidth;gr.classList.add('AN1')}
  requestAnimationFrame(()=>GS_ALL(gr));
}

let GS_RT=null;
function GS_RS(){
  clearTimeout(GS_RT);
  GS_RT=setTimeout(()=>{const gr=document.getElementById('bl-gr');if(gr)GS_ALL(gr)},150);
}

async function init(){
  const gr=document.getElementById('bl-gr');
  const ld=document.getElementById('bl-ld');
  if(!gr||_ini)return;
  _ini=true;
  BN_RB1();
  gr.innerHTML='';
  const[galleries,nw]=await Promise.all([fetchData(),BN_FR(),BN_FT1()]);
  if(ld)ld.style.display='none';
  gr.style.display='';
  PAGE=await BP_1(gr);
  const bl=galleries?parseBlogs(galleries):[];
  const items=BN_MIX(bl,nw);
  _lst=items;curList=items;curPg=0;_cat=null;
  BN_CB1([...new Set(bl.map(x=>x.cat))]);
  renderPage(gr,items,0,false);
  window.addEventListener('resize',GS_RS);
  document.getElementById('bl-wrap')?.addEventListener('contentUnload',()=>{
    window.removeEventListener('resize',GS_RS);
    clearTimeout(GS_RT);
  },{once:true});
}

window.__KP1?.();

init();
function BN_ON(){
if(!document.getElementById('bl-gr'))return;
const OPFS_S=`return(async()=>{
const R=await fetch('web/otros/Archivos/Dinamico/Blogs/data.json',{cache:'no-store'});
if(!R.ok)return notify(null);
const txt=await R.text();
const root=await self.navigator.storage.getDirectory();
const dir=await root.getDirectoryHandle('notify',{create:true});
let prev=null;
try{prev=await(await(await dir.getFileHandle('blogs.state')).getFile()).text();}catch{}
const wh=await(await dir.getFileHandle('blogs.state',{create:true})).createWritable();
await wh.write(txt);await wh.close();
if(prev===null||txt===prev)return notify(null);
const EP=dj=>{
  const bl=dj.galleries.Blogs;
  if(!bl)return[];
  const sub=typeof bl==='object'&&!Array.isArray(bl)?bl:{_r:Array.isArray(bl)?bl:[]};
  return Object.values(sub).flat();
};
const fN=p=>p.split('/').pop().replace(/\.[^.]+$/,'');
const nN=n=>{const m=n.match(/NB=([^.]+)/);return m?m[1].trim():n.replace(/-/g,' ')};
let nA,oA;
try{nA=EP(JSON.parse(txt));oA=EP(JSON.parse(prev));}catch{return notify(null);}
const oIDs=new Set(oA.map(fN));
const nP=nA.filter(p=>!oIDs.has(fN(p)));
for(const p of nP){
  const url=self.location.origin+'/#'+p.replace(/\.[^.]+$/,'.md').replace(/ /g,'%20');
  notify({title:'Nuevo Blog \uD83D\uDCDD',body:nN(fN(p)),image:p,tag:fN(p),url});
}
})();`;

async function wOPFS(){
  try{
    const root=await navigator.storage.getDirectory();
    const dir=await root.getDirectoryHandle('notify',{create:true});
    const fh=await dir.getFileHandle('blogs.js',{create:true});
    const wt=await fh.createWritable();
    await wt.write(OPFS_S);
