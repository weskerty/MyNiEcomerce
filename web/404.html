<style>
.PG_404{max-width:420px;margin:40px auto;padding:28px 20px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:rgba(255,255,255,.03);text-align:center}
.PG_404 h1{border:none!important;font-size:1.8rem;margin-bottom:10px;font-family:var(--font-h)}
.PG_404 p{margin:4px 0;color:rgba(255,255,255,.7)}
.PG_404 img{width:300px;height:300px;object-fit:cover;aspect-ratio:1/1;display:block;margin:16px auto;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.PG_404 .view-all-button{margin-top:18px;display:inline-block}
</style>
<div class="PG_404">
 <p>Nde Tavy Kp No tenes Saldo 😢</p>
 <p>o Peor aun... Lo que Buscas ya se Acabo</p>
 <img src="web/otros/Archivos/Imagenes/Permanente/404.avif" alt="DinoTriste">
 <a href="web/otros/Archivos/HTML/centralPage.html" class="view-all-button">Volver al Inicio</a>
</div>
<script>
(function(){
clearTimeout(window.__RT);
let E4_F1=0,E4_N=0;
const E4_H0=location.hash;
const E4_GO=()=>{
if(E4_F1)return;
if(location.hash===E4_H0&&E4_N++<20)return setTimeout(E4_GO,50);
const h=decodeURIComponent(location.hash.substring(1));
const m=h.match(/NB=([^-]+?)(?:\.\w+)?$/);
const kw=m?m[1].trim():'';
const dest=kw?`#web/search.html#${encodeURIComponent(kw)}`:'#web/search.html';
function goSearch(u){
  u=(u||dest).slice(1);
  const[pp,aa='']=u.split('#');
  history.replaceState({p:pp,a:aa},'','#'+u);
  dispatchEvent(new PopStateEvent('popstate',{state:history.state}));
}
window.__RT=setTimeout(goSearch,5000);
const E4_ID=(h.match(/(?:ID=|#A\/)(\w+)/)||[])[1];
if(E4_ID)fetch('web/Dinamico/data.json').then(r=>r.json()).then(d=>{
  const fl=o=>Object.values(o).flatMap(v=>Array.isArray(v)?v:typeof v==='object'&&v?fl(v):[]);
  const p=fl(d.galleries||{}).find(s=>typeof s==='string'&&(s.match(/ID=(\w+)/)||[])[1]===E4_ID);
  const u=p&&p.replace(/\.[^.]+$/,'.html');
  if(!u||E4_F1||u===h)return;
  clearTimeout(window.__RT);
  goSearch('#'+u);
}).catch(()=>{});
};
E4_GO();
const bgEl=document.getElementById('bg');
const bgPrev=bgEl?.getAttribute('style');
if(bgEl){
  bgEl.style.backgroundImage="url('web/otros/Archivos/Imagenes/Permanente/PS2Fail.avif')";
  bgEl.style.backgroundSize='cover';
  bgEl.style.backgroundPosition='center';
}
document.addEventListener('contentUnload',()=>{
  E4_F1=1;
  clearTimeout(window.__RT);
  if(bgEl)bgEl.setAttribute('style',bgPrev||'');
},{once:true});
})();
</script>
