<style>
#chatw{--cw-r-lg:var(--r-lg,24px);--cw-r-md:var(--r-md,16px);--cw-r-sm:var(--r-sm,12px);display:flex;flex-direction:column;gap:10px}

/* chat screen */
#cw-chat{display:none;flex-direction:column;overflow:hidden}

#cw-lobby.hid{display:none}
#cw-ch-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.1)}

.cw-dl:hover{background:rgba(255,255,255,.13)}

/* input */
#cw-iw{border-top:1px solid rgba(255,255,255,.1)}
#cw-ep{display:none;border-top:1px solid rgba(255,255,255,.08);max-height:260px}
#cw-ep.on{display:flex;flex-direction:column}

#cw-ib{display:flex;align-items:flex-end;gap:6px;padding:8px 10px}

.cw-ibtn.send{background:var(--accent);color:#fff}

/* participants */
#cw-pp{position:fixed;top:0;right:0;bottom:0;width:min(260px,80vw);background:#15161c;border-left:1px solid rgba(255,255,255,.12);transform:translateX(100%);transition:transform .2s;z-index:60;display:flex;flex-direction:column}

body.low-perf #cw-pp,
body.low-perf #cw-pp{transition:none}
#cw-pp h3{padding:14px 16px;margin:0;font-size:.8rem;letter-spacing:.08em;border-bottom:1px solid rgba(255,255,255,.1);color:var(--accent-2,#38bdf8);border-bottom-width:1px!important}
#cw-pl{flex:1;overflow-y:auto;padding:8px}

/* modales (reusa la campana de dialog global) */

.cw-row{display:flex;gap:8px}

<script>
!function(){
const API='/api/chat',POLL=6000,PING=10000,HIST=200,DOM=80,IM_STK=524288;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const mk=(tag,cls)=>{const e=document.createElement(tag);if(cls)e.className=cls;return e;};
const COLS=['#e8a0a0','#e8c4a0','#a8d8a0','#a0c4e8','#c4a8e8','#e8a8d0','#a8dede','#e8e0a0'];
const uC={};let cI=0;
const gUC=pid=>{if(!uC[pid])uC[pid]=COLS[(cI++)%COLS.length];return uC[pid];};
const fSz=b=>b>1048576?(b/1048576).toFixed(1)+'MB':(b/1024).toFixed(0)+'KB';

// --- identidad: cookie para el nombre (sin registro), localStorage solo para el avatar (no entra comodo en una cookie) ---
function ckGet(k){const m=document.cookie.match(new RegExp('(?:^|; )'+k+'=([^;]*)'));return m?decodeURIComponent(m[1]):null;}
function ckSet(k,v){const sec=location.protocol==='https:'?';Secure':'';document.cookie=`${k}=${encodeURIComponent(v)};path=/;max-age=31536000;SameSite=Strict${sec}`;}
let nick=ckGet('cw_nick')||'';
let avB64=localStorage.getItem('cw_av')||'';
function saveNick(n){nick=n;ckSet('cw_nick',n);}
function saveAv(b){avB64=b;try{localStorage.setItem('cw_av',b);}catch{}}

let peer=null,pid=null,curRoom=null,curToken=null;
let conns={},pNk={},pAv={},pAu={},pVStr={},pMu={};
let aStream=null,vStream=null,muted=false,vidOn=false,pingIv=null,pollIv=null;
let hist=[],domCount=0,fMeta={},torrentClient=null;
let epOpen=false,pendingJoin=null,createLock=false;

function showModal(id){$(id).classList.add('on');}
function hideModal(id){$(id).classList.remove('on');}

async function api(method,path,body){
  const o={method,headers:{'Content-Type':'application/json'}};
  if(body)o.body=JSON.stringify(body);
  const r=await fetch(API+path,o);
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(data.error||String(r.status)),{status:r.status});
  return data;
}

// ---------- lobby ----------
function startPoll(){if(pollIv)return;pollIv=setInterval(loadRooms,POLL);}
function stopPoll(){clearInterval(pollIv);pollIv=null;}

async function loadRooms(){
  try{
    const list=await api('GET','/rooms');
    const fv=$('cw-si').value.trim().toLowerCase();
    const arr=(list||[]).filter(r=>!fv||r.name.toLowerCase().includes(fv));
    const lb=$('cw-list');
    if(!arr.length){lb.innerHTML='<div id="cw-empty">Sin salas activas</div>';return;}
    lb.innerHTML='';
    arr.forEach(r=>{
      const d=mk('div','cw-room');
      const ic=mk('div','cw-room-ic');ic.textContent=r.hasPw?'🔒':'💬';
      const tx=mk('div','cw-room-tx');
      const nm=mk('div','cw-room-nm');nm.textContent=r.name;
      const sb=mk('div','cw-room-sb');sb.textContent=(r.count||0)+' conectados';
      tx.append(nm,sb);d.append(ic,tx);
      d.onclick=()=>clickRoom(r);
      lb.appendChild(d);
    });
  }catch(e){}
}
$('cw-si').oninput=loadRooms;

function clickRoom(r){
  if(r.hasPw){
    pendingJoin=r;$('cw-pw-nm').textContent=r.name;$('cw-pw-in').value='';
    showModal('cw-m-pw');setTimeout(()=>$('cw-pw-in').focus(),80);
  }else if(!nick){
    $('cw-pf-nk').value='';showModal('cw-m-perfil');
    $('cw-pf-ok').onclick=()=>{const n=$('cw-pf-nk').value.trim();if(!n)return;saveNick(n);hideModal('cw-m-perfil');enterRoom(r.id,r.name,'');};
  }else enterRoom(r.id,r.name,'');
}

$('cw-new').onclick=()=>{
  if(!nick){
    $('cw-pf-nk').value='';showModal('cw-m-perfil');
    $('cw-pf-ok').onclick=()=>{const n=$('cw-pf-nk').value.trim();if(!n)return;saveNick(n);hideModal('cw-m-perfil');openCreate();};
    return;
  }
  openCreate();
};
function openCreate(){$('cw-cr-nm').value='';$('cw-cr-pw').value='';showModal('cw-m-crear');setTimeout(()=>$('cw-cr-nm').focus(),80);}
$('cw-cr-cx').onclick=()=>hideModal('cw-m-crear');
$('cw-cr-ok').onclick=async()=>{
  if(createLock)return;
  const rn=$('cw-cr-nm').value.trim();
  if(!rn)return;
  createLock=true;$('cw-cr-ok').textContent='...';
  try{
    const pw=$('cw-cr-pw').value;
    const{id}=await api('POST','/rooms',{name:rn,pw});
    hideModal('cw-m-crear');
    enterRoom(id,rn,pw);
  }catch(e){$('cw-cr-ok').textContent='Error';}
  finally{setTimeout(()=>{createLock=false;$('cw-cr-ok').textContent='Crear';},800);}
};

$('cw-pw-cx').onclick=()=>{hideModal('cw-m-pw');pendingJoin=null;};
$('cw-pw-ok').onclick=doJoinPw;
$('cw-pw-in').onkeydown=e=>{if(e.key==='Enter')doJoinPw();};
function doJoinPw(){
  if(!pendingJoin)return;
  const r=pendingJoin,pw=$('cw-pw-in').value;
  pendingJoin=null;hideModal('cw-m-pw');
  if(!nick){
    $('cw-pf-nk').value='';showModal('cw-m-perfil');
    $('cw-pf-ok').onclick=()=>{const n=$('cw-pf-nk').value.trim();if(!n)return;saveNick(n);hideModal('cw-m-perfil');enterRoom(r.id,r.name,pw);};
    return;
  }
  enterRoom(r.id,r.name,pw);
}
$('cw-pf-cx').onclick=()=>hideModal('cw-m-perfil');

// ---------- peerjs signaling ----------
function initPeer(){
  return new Promise((res,rej)=>{
    if(peer&&!peer.destroyed&&pid){res();return;}
    if(peer&&!peer.destroyed)peer.destroy();
    peer=new Peer();
    peer.once('open',id=>{
      pid=id;
      peer.on('connection',conn=>onConn(conn));
      peer.on('call',call=>{
        const s=new MediaStream();
        if(aStream)aStream.getTracks().forEach(t=>s.addTrack(t));
        if(vStream)vStream.getTracks().forEach(t=>s.addTrack(t));
        call.answer(s.getTracks().length?s:new MediaStream());
        hCall(call);
      });
      peer.on('disconnected',()=>{if(curRoom)peer.reconnect();});
      res();
    });
    peer.once('error',e=>rej(e));
  });
}

function meta(){return{nick,av:avB64};}

function onConn(conn){
  conn.on('open',()=>{
    conns[conn.peer]=conn;
    const m=conn.metadata||{};
    pNk[conn.peer]=m.nick||conn.peer.slice(0,8);
    pAv[conn.peer]=m.av||'';
    conn.send({t:'meta',v:meta()});
    conn.send({t:'hist',v:hist.slice(-HIST)});
    addSys((pNk[conn.peer]||conn.peer.slice(0,8))+' se unio');
    renderPeers();callPeer(conn.peer);
  });
  conn.on('data',d=>onData(d,conn.peer));
  conn.on('close',()=>discPeer(conn.peer));
  conn.on('error',()=>discPeer(conn.peer));
}

function callPeer(p){
  const s=new MediaStream();
  if(aStream)aStream.getTracks().forEach(t=>s.addTrack(t));
  if(vStream)vStream.getTracks().forEach(t=>s.addTrack(t));
  if(!s.getTracks().length)return;
  hCall(peer.call(p,s,{metadata:meta()}));
}

function onData(d,from){
  if(!d||!d.t)return;
  switch(d.t){
    case'msg':{
      const col=gUC(from);
      addMsg(pNk[from]||from,d.v,false,col,pAv[from]||'');
      hist.push({t:'msg',from,nick:pNk[from]||from,v:d.v,col,av:pAv[from]||''});
      if(hist.length>HIST)hist.shift();
      break;
    }
    case'meta':pNk[from]=d.v.nick||pNk[from];pAv[from]=d.v.av||'';renderPeers();break;
    case'hist':
      if(!hist.length&&d.v?.length)d.v.forEach(m=>{
        if(m.t==='msg'){uC[m.from]=m.col||gUC(m.from);addMsg(m.nick,m.v,false,m.col,m.av||'');hist.push(m);}
      });
      break;
    case'mute':{const el=$('cw-vp-'+from);if(el){const n=el.querySelector('.cw-vp-n');if(n)n.textContent=(pNk[from]||from)+(d.v?' 🔇':'');}break;}
    case'file':addFileMsg(from,d);break;
  }
}

function hCall(call){
  call.on('stream',stream=>{
    const p=call.peer;
    if(stream.getVideoTracks().length){pVStr[p]=stream;addVidPeer(p,stream);}
    if(stream.getAudioTracks().length){
      let a=pAu[p];
      if(!a){a=mk('audio');a.autoplay=a.playsInline=1;document.body.appendChild(a);pAu[p]=a;}
      a.srcObject=new MediaStream(stream.getAudioTracks());
      if(pMu[p])a.muted=true;
    }
  });
  call.on('close',()=>rmVid(call.peer));
}

function discPeer(p){
  if(!conns[p]&&!pNk[p])return;
  addSys((pNk[p]||p)+' salio');
  delete conns[p];delete pNk[p];
  if(pAu[p]){pAu[p].pause();pAu[p].srcObject=null;pAu[p].remove();delete pAu[p];}
  rmVid(p);renderPeers();
}

// ---------- salas (via chat.js) ----------
async function enterRoom(id,name,pw){
  stopPoll();
  $('cw-msgs').innerHTML='';$('cw-vl').innerHTML='';$('cw-vg').classList.remove('on');
  conns={};pAu={};pVStr={};pMu={};pNk={};pAv={};
  hist=[];domCount=0;

  $('cw-ch-nm').textContent=name.length>26?name.slice(0,26)+'…':name;
  $('cw-ch-sb').textContent='Conectando...';
  $('cw-lobby').classList.add('hid');$('cw-chat').classList.add('on');

  try{await initPeer();}catch(e){addSys('Error al conectar (PeerJS)');return goBack();}

  let data;
  try{data=await api('POST',`/rooms/${id}/join`,{pw,pid,nick});}
  catch(e){addSys(e.status===403?'Contrasena incorrecta':'Error al unirse');return goBack();}

  curRoom=id;curToken=data.token;
  addSys('Conectado como '+nick);
  $('cw-ch-sb').textContent=(pw?'🔒 ':'🌐 ')+((data.peers?.length||0)+1)+' en sala';

  (data.peers||[]).forEach(p=>{
    pNk[p.pid]=p.nick||p.pid.slice(0,8);
    onConn(peer.connect(p.pid,{metadata:meta(),reliable:true}));
  });
  startAudio();

  pingIv=setInterval(async()=>{
    if(!curRoom)return;
    try{
      const d=await api('POST',`/rooms/${curRoom}/ping`,{pid,token:curToken});
      const active=(d.peers||[]).map(p=>p.pid);
      Object.keys(conns).forEach(p=>{if(!active.includes(p))discPeer(p);});
      $('cw-ch-sb').textContent=(pw?'🔒 ':'🌐 ')+(active.length+1)+' en sala';
    }catch(e){}
  },PING);
}

async function startAudio(){
  try{
    aStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:false});
    Object.keys(conns).forEach(p=>callPeer(p));
  }catch(e){}
}

function goBack(){
  clearInterval(pingIv);pingIv=null;
  if(curRoom&&pid)api('DELETE',`/rooms/${curRoom}/leave`,{pid,token:curToken}).catch(()=>{});
  Object.values(conns).forEach(c=>{try{c.close();}catch(e){}});
  if(aStream){aStream.getTracks().forEach(t=>t.stop());aStream=null;}
  if(vStream){vStream.getTracks().forEach(t=>t.stop());vStream=null;}
  Object.values(pAu).forEach(a=>{a.pause();a.srcObject=null;a.remove();});
  if(peer){try{peer.destroy();}catch(e){}peer=null;pid=null;}
  conns={};pAu={};pVStr={};pMu={};pNk={};pAv={};
  curRoom=null;curToken=null;muted=false;vidOn=false;
  $('cw-bm').textContent='🎤';$('cw-bv').style.opacity='1';
  closeEmoji();hidePP();
  $('cw-chat').classList.remove('on');$('cw-lobby').classList.remove('hid');
  startPoll();loadRooms();
}
$('cw-bk').onclick=goBack;

$('cw-bm').onclick=()=>{
  if(!aStream)return;muted=!muted;
  aStream.getAudioTracks().forEach(t=>t.enabled=!muted);
  $('cw-bm').textContent=muted?'🔇':'🎤';
  broadcast({t:'mute',v:muted});
};

$('cw-bv').onclick=async()=>{
  if(!vidOn){
    try{
      vStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480},frameRate:{max:24}},audio:false});
      addVidSelf();Object.keys(conns).forEach(p=>callPeer(p));
      $('cw-vg').classList.add('on');vidOn=true;$('cw-bv').style.opacity='.5';
    }catch(e){addSys('Sin acceso a camara');}
  }else{
    if(vStream){vStream.getTracks().forEach(t=>t.stop());vStream=null;}
    rmVid('me');vidOn=false;$('cw-bv').style.opacity='1';
    if(!Object.keys(pVStr).length)$('cw-vg').classList.remove('on');
  }
};

function mkVP(id,label,stream){
  let ve=$('cw-vp-'+id);
  if(!ve){
    ve=mk('div','cw-vp');ve.id='cw-vp-'+id;
    const vid=mk('video');vid.autoplay=vid.playsInline=1;if(id==='me')vid.muted=1;
    const n=mk('div','cw-vp-n');n.textContent=label;
    ve.append(vid,n);$('cw-vl').appendChild(ve);
  }
  ve.querySelector('video').srcObject=stream;
  return ve;
}
function addVidSelf(){mkVP('me',nick+' (vos)',vStream);}
function addVidPeer(p,s){mkVP(p,pNk[p]||p,s);}
function rmVid(p){const v=$('cw-vp-'+p);if(v)v.remove();delete pVStr[p];if(!Object.keys(pVStr).length&&!vidOn)$('cw-vg').classList.remove('on');}

$('cw-bp').onclick=()=>{$('cw-pp').classList.toggle('on');$('cw-ov').classList.toggle('on');};
$('cw-ov').onclick=hidePP;
function hidePP(){$('cw-pp').classList.remove('on');$('cw-ov').classList.remove('on');}

function renderPeers(){
  $('cw-pl').innerHTML='';
  const addPE=(label,av)=>{
    const d=mk('div','cw-pe');
    const avd=mk('div','cw-pe-av');
    if(av){const img=mk('img');img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:50%';img.src=av;avd.appendChild(img);}
    else avd.textContent=label.slice(0,2).toUpperCase();
    const nm=mk('div','cw-pe-nm');nm.textContent=label;
    d.append(avd,nm);$('cw-pl').appendChild(d);
  };
  addPE(nick+' (vos)',avB64);
  Object.keys(conns).forEach(p=>addPE(pNk[p]||p,pAv[p]||''));
}

// ---------- mensajes ----------
function trimDom(mg){if(domCount>=DOM){const f=mg.querySelector('.cw-msg,.cw-sys');if(f)f.remove();}else domCount++;}

function mkBubble(nm,col,av,me){
  const d=mk('div','cw-msg'+(me?' me':''));
  const avd=mk('div','cw-avi');
  if(av){const img=mk('img');img.src=av;avd.appendChild(img);}
  else{avd.textContent=nm.slice(0,2).toUpperCase();avd.style.background=me?'rgba(var(--accent-rgb),.4)':col;}
  const bwrap=mk('div');
  if(!me){const sn=mk('div','cw-msg-nm');sn.textContent=nm;bwrap.appendChild(sn);}
  const inner=mk('div','cw-msg-b');
  bwrap.appendChild(inner);
  d.append(me?bwrap:avd,me?avd:bwrap);
  return{d,inner};
}

function addMsg(nm,txt,me,col,av){
  const mg=$('cw-msgs');
  const atBottom=mg.scrollHeight-mg.scrollTop-mg.clientHeight<80;
  trimDom(mg);
  const{d,inner}=mkBubble(nm,col,av,me);
  inner.textContent=txt;
  mg.appendChild(d);
  if(atBottom||me)mg.scrollTop=mg.scrollHeight;
}
function addSys(t){
  const mg=$('cw-msgs');trimDom(mg);
  const d=mk('div','cw-sys');d.textContent=t;
  mg.appendChild(d);mg.scrollTop=mg.scrollHeight;
}
function broadcast(data){Object.values(conns).filter(c=>c.open).forEach(c=>{try{c.send(data);}catch(e){}});}

function sendMsg(){
  const v=$('cw-mi').value.trim();if(!v)return;
  const col=gUC(pid||'me');
  broadcast({t:'msg',v});
  addMsg(nick,v,true,col,avB64);
  hist.push({t:'msg',from:pid||'me',nick,v,col,av:avB64});
  if(hist.length>HIST)hist.shift();
  $('cw-mi').value='';$('cw-mi').style.height='';
}
$('cw-sn').onclick=sendMsg;
$('cw-mi').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMsg();}});
$('cw-mi').addEventListener('input',function(){this.style.height='';this.style.height=Math.min(this.scrollHeight,110)+'px';});

$('cw-be').onclick=()=>{epOpen=!epOpen;$('cw-ep').classList.toggle('on',epOpen);};
function closeEmoji(){epOpen=false;$('cw-ep').classList.remove('on');}
$('cw-emj').addEventListener('emoji-click',e=>{$('cw-mi').value+=(e.detail.unicode||'');$('cw-mi').focus();});

// ---------- archivos: WebTorrent, swarm real entre los que ya lo tienen ----------
async function getTorrentClient(){
  if(torrentClient)return torrentClient;
  const{default:WebTorrent}=await import('https://esm.sh/webtorrent@3.0.16/dist/webtorrent.min.js');
  torrentClient=new WebTorrent();
  torrentClient.on('error',e=>console.error('[webtorrent]',e.message));
  return torrentClient;
}

$('cw-fl').onchange=async function(){
  const f=this.files[0];this.value='';if(!f)return;
  try{
    const client=await getTorrentClient();
    client.seed(f,{name:f.name},torrent=>{
      const id=torrent.infoHash;
      let w=0,h=0;
      const dd={t:'file',id,magnet:torrent.magnetURI,name:f.name,size:f.size,mime:f.type||'application/octet-stream',w,h};
      const afterDims=()=>{broadcast(dd);addOwnFileMsg(f,dd,torrent);};
      if(/^image\//.test(f.type)){
        const u=URL.createObjectURL(f),i=new Image();
        i.onload=()=>{dd.w=i.naturalWidth;dd.h=i.naturalHeight;URL.revokeObjectURL(u);afterDims();};
        i.onerror=()=>afterDims();
        i.src=u;
      }else afterDims();
    });
  }catch(e){addSys('Error al compartir archivo: '+e.message);}
};

const isStk=fm=>/^image\/(avif|webp|gif|png|jpeg)$/.test(fm.mime)&&fm.size<=IM_STK&&fm.w>0&&fm.w<=600&&fm.h>0&&fm.h<=600;

function addOwnFileMsg(file,dd,torrent){
  const mg=$('cw-msgs');trimDom(mg);
  const{d,inner}=mkBubble(nick,gUC(pid||'me'),avB64,true);
  const wrap=mk('div');inner.appendChild(wrap);
  const url=URL.createObjectURL(file);
  if(isStk(dd)){const img=mk('img','cw-stk');img.src=url;wrap.appendChild(img);}
  else{
    const btn=mk('div','cw-dl');btn.innerHTML=`⬇ ${esc(dd.name)} <span style="opacity:.6">(${fSz(dd.size)})</span>`;
    btn.onclick=()=>{const a=mk('a');a.href=url;a.download=dd.name;a.click();};
    wrap.appendChild(btn);
  }
  mg.appendChild(d);mg.scrollTop=mg.scrollHeight;
}

async function addFileMsg(from,dd){
  const mg=$('cw-msgs');trimDom(mg);
  const nm=pNk[from]||from,av=pAv[from]||'',col=gUC(from);
  const{d,inner}=mkBubble(nm,col,av,false);
  const wrap=mk('div');inner.appendChild(wrap);
  const pr=mk('div','cw-torrent-pr');pr.textContent='Descargando de la red...';
  wrap.appendChild(pr);
  mg.appendChild(d);mg.scrollTop=mg.scrollHeight;
  try{
    const client=await getTorrentClient();
    client.add(dd.magnet,torrent=>{
      const iv=setInterval(()=>{
        if(!document.body.contains(pr))return clearInterval(iv);
        pr.textContent=`Descargando... ${(torrent.progress*100).toFixed(0)}% (${torrent.numPeers} fuentes)`;
      },500);
      torrent.on('done',async()=>{
        clearInterval(iv);
        const file=torrent.files[0];
        const blob=await file.blob();
        const url=URL.createObjectURL(blob);
        wrap.innerHTML='';
        if(isStk(dd)){const img=mk('img','cw-stk');img.src=url;wrap.appendChild(img);}
        else{
          const btn=mk('div','cw-dl');btn.innerHTML=`⬇ ${esc(dd.name)} <span style="opacity:.6">(${fSz(dd.size)})</span>`;
          btn.onclick=()=>{const a=mk('a');a.href=url;a.download=dd.name;a.click();};
          wrap.appendChild(btn);
        }
      });
    });
  }catch(e){pr.textContent='Error al descargar: '+e.message;}
}

// ---------- ciclo de vida (core.js) ----------
const contentEl=document.getElementById('content');
function teardown(){
  stopPoll();
  if(curRoom)goBack();
  if(torrentClient){try{torrentClient.destroy();}catch(e){}torrentClient=null;}
}
if(contentEl)contentEl.addEventListener('contentUnload',teardown,{once:true});
window.addEventListener('beforeunload',teardown);

loadRooms();startPoll();
}();
</script>
