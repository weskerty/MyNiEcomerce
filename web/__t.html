<!doctype html><html><head><link rel="stylesheet" href="estilo.css"></head><body>
<button class="back-button act" id="a">Nueva</button><button class="back-button" id="b">Mis</button><button aria-pressed="true" id="c">X</button>
<pre id="o"></pre><script>setTimeout(()=>{let sel='';const w=r=>{for(const x of r.cssRules||[]){if(x.selectorText&&x.selectorText.includes('FR1')||x.style&&x.style.animationName==='FR1')sel=x.selectorText;w(x)}};for(const s of document.styleSheets)w(s);o.textContent=['a','b','c'].map(i=>{const e=document.getElementById(i);document.body.classList.remove('low-perf');return i+':R='+(getComputedStyle(e).getPropertyValue('--GL_R').includes('gradient')&&getComputedStyle(e).getPropertyValue('--GL_R')===getComputedStyle(document.body).getPropertyValue('--GL_RC')?'RC':'def')+',anim='+e.matches(sel)}).join(' ')},300)</script></body></html>
