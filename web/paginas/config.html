<style>
#ST_W{padding:8px 12px}
#ST_D[hidden]{display:none}
body.low-perf #FD_W1{display:none}
.ST_INFO{font-size:.78em;color:rgba(255,255,255,.5);margin-bottom:10px}
.ST_CACHES{display:flex;flex-direction:column;gap:8px}
.ST_CI{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid var(--rdm-border);border-radius:var(--r-sm);padding:12px 14px}
.ST_CI .nm{flex:1;font-size:.9em}
.ST_CACHES .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ST_CI .ct{font-size:.75em;color:rgba(255,255,255,.5);flex-shrink:0}
.ST_CI button{min-width:0;padding:4px 10px}
label.ST_CI{cursor:pointer}
.ST_MSG{text-align:center;color:rgba(255,255,255,.5);padding:24px;font-size:.9em}
</style>

<div id="ST_W">
<label class="ST_CI"><span class="nm">Desactivar Transparencia y Animaciones</span><input type="checkbox" id="ST_SW"></label>
<div class="ST_CI" id="FD_W1"><span class="nm">🖼️ Fondo de pantalla</span><button id="FD_B1">Elegir</button><button id="FD_R1">Restaurar</button><input type="file" id="FD_I1" accept="image/*" hidden></div>
<details id="ST_ND" hidden>
<summary>🔔 Notificaciones</summary>
<div class="ST_CACHES" id="ST_NT"></div>
</details>
<details id="ST_FV" hidden>
<summary>⭐ Favoritos</summary>
<div class="ST_CACHES" id="ST_FL"></div>
</details>
<details id="ST_D" hidden>
<summary>🧹 Liberar espacio</summary>
<section>
<div class="ST_INFO" id="ST_QT"></div>
<p>Es contenido que se vuelve a llenar al navegar. Se descarga una vez para ahorrar saldo. Pero puedes borrar para liberar espacio.</p>
<div class="ST_CACHES" id="ST_CL"></div>
</section>
</details>
</div>

<script>
(function(){
  const $=i=>document.getElementById(i);
  const dEl=$('ST_D'),clEl=$('ST_CL'),qtEl=$('ST_QT'),swEl=$('ST_SW');
  const fmt=b=>b<1024?b+' B':b<1048576?(b/1024).toFixed(1)+' KB':b<1073741824?(b/1048576).toFixed(1)+' MB':(b/1073741824).toFixed(2)+' GB';
  const upd=e=>{qtEl.textContent=fmt(e.usage)+' / '+fmt(e.quota)};
  const B=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.onclick=f;return b};
  const S=(c,t)=>{const s=document.createElement('span');s.className=c;s.textContent=t;return s};

  async function walk(d,p,o){
    for await(const[n,h]of d.entries()){
      if(h.kind==='directory'){if(p||n!=='notify')await walk(h,p+n+'/',o)}
      else try{o.push({l:'📄 '+p+n,s:(await h.getFile()).size,n,g:()=>h.getFile(),x:()=>d.removeEntry(n)})}catch{}
    }
  }

  async function cs(o){
    for(const k of await caches.keys()){
      const c=await caches.open(k);let s=0;
      for(const q of await c.keys()){
        const r=await c.match(q);
        if(r)s+=+r.headers.get('content-length')||(await r.blob()).size;
      }
      if(s)o.push({l:'🗄️ Cache '+k,s,x:()=>caches.delete(k)});
    }
  }

  function row(it){
    const r=document.createElement('div');r.className='ST_CI';
    r.append(S('nm',it.l),S('ct',fmt(it.s)));
    if(it.g)r.append(B('⬇️',async()=>{
      const u=URL.createObjectURL(await it.g()),a=document.createElement('a');
      a.href=u;a.download=it.n;document.body.append(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),4000);
    }));
    r.append(B('🗑️',async()=>{
      if(!confirm('Borrar '+it.l+'? No se puede deshacer.'))return;
      try{await it.x()}catch{}
      load();
    }));
    return r;
  }

  async function load(){
    clEl.innerHTML='<p class="ST_MSG">Calculando...</p>';
    const o=[];
    try{await cs(o)}catch{}
    try{await walk(await navigator.storage.getDirectory(),'',o)}catch{}
    o.sort((a,b)=>b.s-a.s);
    if(!o.length){dEl.hidden=true;return}
    clEl.replaceChildren(...o.slice(0,10).map(row));
    navigator.storage.estimate().then(upd).catch(()=>{});
  }

  swEl.checked=localStorage.getItem('perf')==='low';
  swEl.onchange=()=>{
    localStorage.setItem('perf',swEl.checked?'low':'high');
    document.body.classList.toggle('low-perf',swEl.checked);
  };

  const FD_U='web/recursos/fondos/wallpaper.webp';
  async function FD_C1(){for(const k of await caches.keys()){const c=await caches.open(k);if(await c.match(FD_U))return c}throw 0}
  const FD_F1=async r=>{await(await FD_C1()).put(FD_U,r);await fetch(FD_U,{cache:'reload'});location.reload()};
  $('FD_B1').onclick=()=>$('FD_I1').click();
  $('FD_I1').onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{
      const b=await createImageBitmap(f,{imageOrientation:'from-image'}),k=Math.min(1,2560/Math.max(b.width,b.height)),c=document.createElement('canvas'),x=c.getContext('2d');
      c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);
      x.fillStyle='#111';x.fillRect(0,0,c.width,c.height);x.drawImage(b,0,0,c.width,c.height);
      const T=t=>new Promise(r=>c.toBlob(r,t,.85));
      let o=await T('image/webp');if(o?.type!=='image/webp')o=await T('image/jpeg');
      await FD_F1(new Response(o));
    }catch{alert('Error Fondo')}
  };
  $('FD_R1').onclick=async()=>{
    try{const r=await fetch(FD_U+'?r='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;await FD_F1(r)}catch{alert('Error Fondo')}
  };

  async function nt(){
    let d;try{d=await(await navigator.storage.getDirectory()).getDirectoryHandle('notify')}catch{return}
    const l=[];
    for await(const[n,h]of d.entries())if(h.kind==='file'&&n.endsWith('.js'))l.push([n,h]);
    $('ST_ND').hidden=!l.length;
    $('ST_NT').replaceChildren(...await Promise.all(l.sort().map(async([n,h])=>{
      const r=document.createElement('label'),c=document.createElement('input');
      r.className='ST_CI';c.type='checkbox';
      c.checked=!/RUN\s*=\s*false/.test(await(await h.getFile()).text());
      c.onchange=async()=>{
        const t=await(await h.getFile()).text(),v=c.checked?'RUN=true':'RUN=false';
        const w=await h.createWritable();
        await w.write(/RUN\s*=\s*(true|false)/.test(t)?t.replace(/RUN\s*=\s*(true|false)/,v):`const ${v};if(!RUN)return;\n`+t);
        await w.close();
      };
      r.append(S('nm',n.slice(0,-3).replace(/^./,x=>x.toUpperCase())),c);
      return r;
    })));
  }
  nt();

  const FK='⭐ Favoritos';
  function fv(){
    let l=[];
    try{l=JSON.parse(localStorage.getItem('FAV')).galleries[FK]||[]}catch{}
    $('ST_FV').hidden=!l.length;
    $('ST_FL').replaceChildren(...l.map((p,i)=>{
      const r=document.createElement('div');r.className='ST_CI';
      r.append(S('nm',p.split('/').pop().replace(/\.[^.]+$/,'')),B('🗑️',()=>{
        l.splice(i,1);
        try{localStorage.setItem('FAV',JSON.stringify({galleries:{[FK]:l}}))}catch{}
        fv();
      }));
      return r;
    }));
  }
  fv();

  dEl.ontoggle=()=>{if(dEl.open)load()};
  navigator.storage?.estimate?.().then(e=>{if(typeof e.usage==='number'){dEl.hidden=false;upd(e)}}).catch(()=>{});
})();
</script>
