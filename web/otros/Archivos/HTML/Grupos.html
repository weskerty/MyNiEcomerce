<style>

.lk-mp{border-color:rgba(234,67,53,.35);color:#ff7b6e;--LK_I:url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z'/%3E%3C/svg%3E")}
.AG_PN1{position:relative;font:24px var(--font);line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}

<script>
(function(){
const RSS_PATH='telegram/channel/cheagana';
const RSS_URL='/api/rss?url='+encodeURIComponent(RSS_PATH);
const cEl=document.getElementById('rv-c');
const fEl=document.getElementById('rv-f');
const btn=document.getElementById('rv-btn');
const ovEl=document.getElementById('rv-ov');
const sentinel=document.getElementById('rv-sentinel');
let items=[],_populated=false,_chunkIdx=0;
const PREVIEW=4,CHUNK=8;

const LD=document.createElement('link');
LD.rel='alternate';LD.type='application/rss+xml';
LD.title='Actividades Paraguay';LD.href=RSS_URL;
document.head.appendChild(LD);

function lk(href,type,label){
  return`<a class="lk lk-${type}" href="${href}" target="_blank" rel="noopener noreferrer">${label}</a>`;
}

function gT(el,tag){return el.getElementsByTagName(tag)[0]?.textContent||'';}
function gH(el,tag){
  const n=el.getElementsByTagName(tag)[0];
  if(!n)return'';
  const c=n.firstChild;
  return(c&&c.nodeType===4)?c.data:n.textContent;
}
function fI(html){
  return new DOMParser().parseFromString(html,'text/html').querySelector('img')?.src||null;
}

function AG_X(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;e.textContent=txt;return e;}

const AG=document.getElementById('AG1'),AG_C=document.getElementById('AG_C1'),AG_T=document.getElementById('AG_T1'),AG_M=document.getElementById('AG_M1'),FH=document.getElementById('rv-fh');
const AG_MS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Setiembre','Octubre','Noviembre','Diciembre'];
const LF_L='web/scripts/Otros/Leaflet/',LF_C='https://cdn.jsdelivr.net/npm/leaflet@1/dist/';
const EVM=new Map();
let AY=0,AM=0,MP=null,MK=null,LP=null,GR=[],PC=null,_ls=[],MY=null,MM=null;

const AG_IC=(t,n)=>L.divIcon({html:`<div class="AG_PN1">${t}${n>1?`<b>${n}</b>`:''}</div>`,className:'',iconSize:[28,28],iconAnchor:[14,26]});

function AG_ME(){
  if(!MP||!MY||MM)return;
  MM=L.marker(MY,{icon:AG_IC('📍'),zIndexOffset:1000}).addTo(MP).bindTooltip('Tu ubicacion');
}

function AG_GL(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(p=>{
    MY=[p.coords.latitude,p.coords.longitude];
    try{localStorage.setItem('UBI','1');}catch{}
    AG_ME();
  },()=>{},{timeout:10000,maximumAge:60000});
}

function AG_LF(){
  return LP??=window.L?Promise.resolve():new Promise((ok,ko)=>{
    const css=document.createElement('link');
    css.rel='stylesheet';css.href=LF_L+'leaflet.css';
    css.onerror=()=>{css.href=LF_C+'leaflet.css'};
    document.head.appendChild(css);
    const add=(src,fb)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=fb;document.head.appendChild(s);};
    add(LF_L+'leaflet.js',()=>add(LF_C+'leaflet.js',ko));
  });
}

function AG_G(e){
  const z=n=>String(n).padStart(2,'0'),F=x=>`${x.getFullYear()}${z(x.getMonth()+1)}${z(x.getDate())}`,U=x=>`${F(x)}T${z(x.getHours())}${z(x.getMinutes())}00`;
  const n=new Date(e.dt);n.setDate(n.getDate()+1);
  const q={action:'TEMPLATE',text:e.t,dates:e.ad?`${F(e.dt)}/${F(n)}`:`${U(e.dt)}/${U(new Date(+e.dt+72e5))}`,ctz:'America/Asuncion',details:e.l};
  if(e.p)q.location=e.p.join(',');
  return'https://calendar.google.com/calendar/render?'+new URLSearchParams(q);
}

function AG_K(it){
  const e=EVM.get(it);
  if(!e)return'';
  const k=AG_X('div','AG_K1',''),c=AG_X('a','lk lk-ag','Agendar');
  c.href=AG_G(e);c.target='_blank';c.rel='noopener noreferrer';
  k.append(c);
  if(e.p){const m=AG_X('button','lk lk-mp','Mapa');m.onclick=()=>AG_FM(e);k.append(m);}
  return k;
}

function AG_FM(e){
  if(ovEl.open)rvClose();
  PC=e.p;
  if(AY!==e.dt.getFullYear()||AM!==e.dt.getMonth()){AY=e.dt.getFullYear();AM=e.dt.getMonth();AG_R();}else AG_MR();
  AG.scrollIntoView({block:'start',behavior:'smooth'});
}

function AG_NB(g){
  const c=MP.latLngToContainerPoint(g.p),S=new Set();
  for(const h of GR)if(MP.latLngToContainerPoint(h.p).distanceTo(c)<40)h.its.forEach(i=>S.add(i));
  rvOpen(i=>S.has(i),`📍 ${S.size} ${S.size>1?'eventos en la zona':'evento'}`);
}

function AG_MR(){
  const G={};
  for(const [i,e] of EVM)if(e.p&&e.dt.getFullYear()===AY&&e.dt.getMonth()===AM)(G[e.p.map(x=>x.toFixed(4))]??={p:e.p,its:[]}).its.push(i);
  GR=Object.values(G);
  AG_M.hidden=!GR.length;
  if(!GR.length)return;
  AG_LF().then(()=>{
    if(!AG.isConnected)return;
    if(!MP){
      MP=L.map(AG_M,{scrollWheelZoom:false});
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',maxZoom:19}).addTo(MP);
      MK=L.layerGroup().addTo(MP);
    }
    MK.clearLayers();
    for(const g of GR)L.marker(g.p,{icon:AG_IC('📅',g.its.length)}).on('click',()=>AG_NB(g)).addTo(MK);
    AG_ME();
    MP.invalidateSize();
    const pts=GR.map(g=>g.p);
    if(MY)pts.push(MY);
    if(PC){MP.setView(PC,17);PC=null;}else if(pts.length>1)MP.fitBounds(pts,{padding:[30,30],maxZoom:16});else MP.setView(pts[0],15);
  }).catch(()=>{AG_M.hidden=true;});
}

function AG_R(){
  AG_T.textContent=AG_MS[AM]+' '+AY;
  const y=AY,m=AM,off=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),hy=new Date(),ds=new Set();
  for(const e of EVM.values())if(e.dt.getFullYear()===y&&e.dt.getMonth()===m)ds.add(e.dt.getDate());
  AG_C.textContent='';
  for(const c of 'LMMJVSD')AG_C.append(AG_X('b','',c));
  for(let i=0;i<off;i++)AG_C.append(document.createElement('span'));
  for(let d=1;d<=n;d++){
    const td=y===hy.getFullYear()&&m===hy.getMonth()&&d===hy.getDate()?'AG_H2':'';
    if(!ds.has(d)){AG_C.append(AG_X('span',td,d));continue;}
    const b=AG_X('button','AG_E1 '+td,d);
    b.onclick=()=>rvOpen(i=>{const e=EVM.get(i);return e&&e.dt.getFullYear()===y&&e.dt.getMonth()===m&&e.dt.getDate()===d;},`📅 ${d}/${m+1}/${y}`);
    AG_C.append(b);
  }
  AG_MR();
}

function AG_V(k){AM+=k;if(AM<0){AM=11;AY--;}else if(AM>11){AM=0;AY++;}AG_R();}
document.getElementById('AG_P1').onclick=()=>AG_V(-1);
document.getElementById('AG_N1').onclick=()=>AG_V(1);

function AG_P(its){
  for(const i of its){
    const s=gT(i,'ev:startdate').trim();
    if(!/^\d{4}-\d\d-\d\d/.test(s))continue;
    const [y,m,d,h=0,mi=0]=s.match(/\d+/g).map(Number),g=gT(i,'georss:point').trim().split(/\s+/).map(Number);
    EVM.set(i,{t:gT(i,'title'),l:gT(i,'link'),dt:new Date(y,m-1,d,h,mi),ad:s.length===10,p:g.length===2&&g.every(isFinite)?g:null});
  }
  if(!EVM.size)return;
  const hy=new Date();hy.setHours(0,0,0,0);
  const ev=[...EVM.values()].sort((a,b)=>a.dt-b.dt),nx=ev.find(e=>e.dt>=hy)||ev[ev.length-1];
  AY=nx.dt.getFullYear();AM=nx.dt.getMonth();
  AG.hidden=false;
  AG_R();
  if(GR.length)AG_GL();
}

function mkItem(item,full){
  const title=gT(item,'title'),link=gT(item,'link'),
        desc=gH(item,'description'),date=gT(item,'pubDate'),e=EVM.get(item),
        d=e?e.dt.toLocaleString('es-PY',e.ad?{weekday:'short',day:'2-digit',month:'2-digit'}:{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})
          :date?new Date(date).toLocaleString('es-PY',full?undefined:{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
  if(!full){
    const img=fI(desc),o=AG_X('div','rv-ci',''),th=document.createElement(img?'img':'div'),inf=AG_X('div','rv-ci-info',''),t=AG_X('div','rv-ci-title',''),a=AG_X('a','',title);
    a.href=link;a.target='_blank';a.rel='noopener noreferrer';
    t.append(a);
    th.className='rv-ci-thumb'+(img?'':' rv-no');
    if(img){th.src=img;th.loading='lazy';}else th.textContent='📌';
    inf.append(t,AG_X('div','rv-ci-meta',d),AG_K(item));
    o.append(th,inf);
    return o;
  }
  const author=gT(item,'author'),div=document.createElement('div');
  div.className='rv-it';
  div.innerHTML=`<div class="rv-it-meta"></div><div class="rv-it-title"><a target="_blank" rel="noopener noreferrer"></a></div><div class="rv-it-body">${desc}</div>`;
  div.firstChild.textContent=[author,d].filter(Boolean).join(' · ');
  const ta=div.querySelector('.rv-it-title a');
  ta.href=link;ta.textContent=title;
  ta.parentNode.after(AG_K(item));
  return div;
}

function appendChunk(){
  if(_chunkIdx>=_ls.length)return;
  const end=Math.min(_chunkIdx+CHUNK,_ls.length);
  const frag=document.createDocumentFragment();
  for(let i=_chunkIdx;i<end;i++)frag.appendChild(mkItem(_ls[i],true));
  fEl.appendChild(frag);
  _chunkIdx=end;
}

let _io=null;
function setupIO(){
  if(_io)_io.disconnect();
  _io=new IntersectionObserver(entries=>{
    if(entries[0].isIntersecting)appendChunk();
  },{root:ovEl,rootMargin:'200px'});
  _io.observe(sentinel);
}

const OPFS_S=`return(async()=>{
const R=await fetch('/api/rss?url=${encodeURIComponent(RSS_PATH)}',{cache:'no-store'});
if(!R.ok)return notify(null);
const x=await R.text();
const gM=x.match(/<item>[\\s\\S]*?<guid[^>]*>([^<]+)<\\/guid>/);
if(!gM)return notify(null);
const guid=gM[1];
const root=await self.navigator.storage.getDirectory();
const dir=await root.getDirectoryHandle('notify',{create:true});
let prev=null;
try{prev=await(await(await dir.getFileHandle('rss.state')).getFile()).text();}catch{}
const wh=await(await dir.getFileHandle('rss.state',{create:true})).createWritable();
await wh.write(guid);await wh.close();
if(prev===null||guid===prev)return notify(null);
const tM=x.match(/<item>[\\s\\S]*?<title>([^<]+)<\\/title>/);
const title=(tM?tM[1]:'Nueva actividad').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
const iM=x.match(/poster=&quot;(https:\\/\\/[^&]+)&quot;/)||x.match(/src=&quot;(https:\\/\\/[^&\\s]+)&quot;/);
const lM=x.match(/<item>[\\s\\S]*?<link>([^<]+)<\\/link>/);
notify({title:'Nueva actividad \\uD83D\\uDCC5',body:title,...(iM?{image:iM[1]}:{}),tag:'rss-'+guid,url:lM?lM[1]:'${location.origin}'});
})();`;

async function wOPFS(){
  try{
    const root=await navigator.storage.getDirectory();
    const dir=await root.getDirectoryHandle('notify',{create:true});
    const fh=await dir.getFileHandle('rss.js',{create:true});
    const wt=await fh.createWritable();
    await wt.write(OPFS_S);
    await wt.close();
  }catch{}
}

async function load(){
  try{
    const sk=document.createDocumentFragment();
    for(let i=0;i<PREVIEW;i++){const d=document.createElement('div');d.className='rv-skeleton';sk.appendChild(d);}
    cEl.appendChild(sk);
    const res=await fetch(RSS_URL);
    cEl.innerHTML='';
    if(!res.ok)return;
    const doc=new DOMParser().parseFromString(await res.text(),'text/xml');
    if(doc.querySelector('parseerror'))return;
    items=[...doc.querySelectorAll('item')];
    if(!items.length)return;
    AG_P(items);
    const frag=document.createDocumentFragment();
    items.slice(0,PREVIEW).forEach(i=>frag.appendChild(mkItem(i,false)));
    cEl.appendChild(frag);
    btn.style.display='';
  }catch{cEl.innerHTML='';}
}

window.rvOpen=function(f,lb){
  if(!_populated||f||_ls!==items){
    _populated=true;
    _ls=typeof f==='function'?items.filter(f):items;
    FH.textContent='';
    if(_ls!==items){const b=AG_X('button','','Ver todas');b.onclick=()=>rvOpen();FH.append(AG_X('span','',lb),b);}
    _chunkIdx=0;
    fEl.innerHTML='';
    appendChunk();
    setupIO();
    ovEl.scrollTop=0;
  }
  if(!ovEl.open)ovEl.showModal();
  document.body.style.overflow='hidden';
};
window.rvClose=function(){ovEl.close();document.body.style.overflow='';};
ovEl.addEventListener('close',()=>{document.body.style.overflow='';});

document.addEventListener('contentUnload',function(){
  if(ovEl.open)ovEl.close();
  document.body.style.overflow='';
  if(_io){_io.disconnect();_io=null;}
  if(MP){MP.remove();MP=null;MM=null;}
  LD.remove();
  delete window.rvOpen;
  delete window.rvClose;
},{once:true});

load();
wOPFS();
})();
</script>
