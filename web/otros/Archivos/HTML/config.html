<style>
.AJ_T1{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer}
.AJ_T1 input{position:absolute;opacity:0}
.AJ_T1 i{position:relative;flex:none;width:48px;height:28px;border-radius:14px;background:rgba(255,255,255,.2);transition:background .2s}
.AJ_T1 i::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:translate .2s}
.AJ_T1 input:checked+i{background:#4cd964}
.AJ_T1 input:checked+i::after{translate:20px 0}
.AJ_T1 input:focus-visible+i{outline:2px solid #fff;outline-offset:2px}
</style>
<label class="AJ_T1"><span>Desactivar Transparencia y Animaciones</span><input type="checkbox" id="AJ_C1"><i></i></label>
<script>
!function(){const c=document.getElementById('AJ_C1');c.checked=localStorage.getItem('perf')==='low';c.onchange=()=>{const v=c.checked;localStorage.setItem('perf',v?'low':'high');document.body.classList.toggle('low-perf',v)}}()
</script>
