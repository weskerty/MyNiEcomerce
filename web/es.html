<script>
(function(){
window.__KP1?.();
const OPFS_S=`const RUN=true;
if(!RUN)return;
return(async()=>{
const R=await fetch('web/tienda/data.json',{cache:'no-store'});
if(!R.ok)return notify(null);
const txt=await R.text();
const root=await self.navigator.storage.getDirectory();
const dir=await root.getDirectoryHandle('notify',{create:true});
let prev=null;
try{prev=await(await(await dir.getFileHandle('productos.state')).getFile()).text();}catch{}
const wh=await(await dir.getFileHandle('productos.state',{create:true})).createWritable();
await wh.write(txt);await wh.close();
if(prev===null||txt===prev)return notify(null);
const EP=dj=>Object.values(dj.galleries).flatMap(c=>Object.values(c).flat());
const SM=(p,n)=>p.split('/').some(s=>s.replace(/^[^a-zA-Z]+/,'')===n);
const eN=p=>{
  if(SM(p,'Blogs'))return'blog';
  if(SM(p,'Apps'))return'app';
  if(SM(p,'Juegos'))return'game';
  return'product';
};
const eID=p=>{
  const f=p.split('/').pop().replace(/\.[^.]+$/,'');
  if(eN(p)!=='product')return f;
  const m=f.match(/ID=([^-]+)/);
  return m?m[1]:f;
};
const eNM=p=>{
  const f=p.split('/').pop().replace(/\.[^.]+$/,'');
  const m=f.match(/NB=(.+)$/);
  return m?m[1]:f;
};
const NTL={blog:'Nuevo Blog \uD83D\uDCDD',app:'Nueva App \uD83D\uDCF1',game:'Nuevo Juego \uD83C\uDFAE',product:'Nuevo Producto \uD83D\uDED2'};
let nA,oA;
try{nA=EP(JSON.parse(txt));oA=EP(JSON.parse(prev));}catch{return notify(null);}
const oIDs=new Set(oA.map(eID));
const nP=nA.filter(p=>!oIDs.has(eID(p)));
for(const p of nP){
  const type=eN(p);
  const url=self.location.origin+'/#'+p.replace(/\.[^.]+$/,'.html').replace(/ /g,'%20');
  notify({title:NTL[type],body:eNM(p),image:p,tag:eID(p),url});
}
})();`;

async function wOPFS(){
  try{
    const root=await navigator.storage.getDirectory();
    const dir=await root.getDirectoryHandle('notify',{create:true});
    const fh=await dir.getFileHandle('productos.js',{create:true});
    if(/RUN\s*=\s*false/.test(await(await fh.getFile()).text()))return;
    const wt=await fh.createWritable();
    await wt.write(OPFS_S);
    await wt.close();
  }catch{}
}

async function regPeriodicSync(){
  try{
    const reg=await navigator.serviceWorker.ready;
    if(!('periodicSync' in reg))return;
    const status=await navigator.permissions.query({name:'periodic-background-sync'});
    if(status.state!=='granted')return;
    await reg.periodicSync.register('notify-check',{minInterval:259200000});
  }catch{}
}

wOPFS();
regPeriodicSync();
})();
</script>
